name: CI — Architecture & Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-architecture:
    name: Import Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run import-linter
        run: |
          lint-imports

  mypy-strict:
    name: mypy strict (new architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run mypy on domain/ infra/ use_cases/
        run: |
          cd backend && python -m mypy \
            domain/ \
            infra/cache/ \
            infra/store/ \
            infra/llm/ \
            infra/data_source/__init__.py \
            use_cases/ \
            --config-file ../pyproject.toml

  lint-main-py:
    name: main.py < 200 lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check main.py line count
        run: |
          python scripts/lint_main_py.py

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run smoke tests
        run: |
          cd backend && python -m pytest ../tests/test_skeleton_m1.py -v

  backend-test-suite:
    # 2026-09-13 新增。此前**全仓库 CI 里唯一一条 pytest 命令就是上面的 smoke-tests**
    # （`pytest ../tests/test_skeleton_m1.py`），跑的是根目录 tests/ 下的 1 个文件；
    # 截至 47ed742 时 backend/tests/ 下有 71 个 test_*.py、1582 条用例从未在 CI 上
    # 执行过一次（此后随测试增长，本注释保留的是引入该 job 时的快照，不是当前值）。
    #
    # 后果：一批已经写好的回归守卫等于"上锁没挂门"——test_prompt_governance、
    # test_no_hardcoded_stats、test_deploy_asset_coverage、test_single_source_of_truth、
    # test_prompt_ab_verdict_gate、test_confidence_default_and_render、
    # test_factor_ic_no_lookahead、test_fund_industry_unified_taxonomy 等，
    # 写完即不会自动红，回归可以静默发生。
    #
    # 独立成 job（不塞进 smoke-tests）的理由：失败归因清楚（一眼看出是后端全量套件红了），
    # 且与其它 job 并行，不拖慢总时长。
    #
    # 依赖只装 requirements.txt + pytest，**刻意不装 requirements-dev.txt**：
    # 实测（Python 3.11.16 干净 venv + ubuntu 同源的 pip 解析结果）该组合即可跑满
    # （引入该 job 时的快照）1582 passed / 0 failed，而 requirements-dev.txt 会额外拉入
    # sentence-transformers→torch（GB 级）而套件根本不 import 它们。
    # 装生产依赖而非测试依赖，也更贴近线上真实环境。
    name: Backend Test Suite (backend/tests 全量)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest>=7.4.0"
      - name: Run backend test suite
        run: |
          cd backend && python -m pytest tests/ -q -p no:cacheprovider

  red-team-audit:
    name: Red Team Audit (AI Boundary Enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run red team static audit
        run: |
          python scripts/red_team_audit_ci.py

  north-caliber:
    # 2026-08-30 新增。防止「北向资金口径」这类修复将来退化。
    # 背景：2024-08-19 起沪深交易所停止披露北向日频净买入（改按季度公布），
    # Tushare moneyflow_hsgt 的 north_money/hgt/sgt 此后是【当日成交额】。
    # 本次排查在全仓库找到 19 个消费点、6 个 LLM prompt 注入点，全靠人肉 grep ——
    # 而人肉扫描的完备性已被反复证伪。这条检查用机器守住不变量：
    # 禁止把 north_money / ggt_ss_flow / ggt_sz_flow 当作「净流入」命名。
    # 纯静态扫描，无需安装依赖，所以独立成 job 跑得快、失败归因也清楚。
    name: North Caliber Guard (禁止把成交额当净流入)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run north caliber static check
        run: |
          python scripts/north_caliber_ci.py

